# Configuration for OrangeHrm BDD framework
# Place sensitive values in environment variables or a CI secrets store for production
# Application
base.url=https://opensource-demo.orangehrmlive.com/

# Browser settings: chrome, firefox, edge
browser=chrome
headless=false
# If true, run browsers headless. Acceptable values: true/false

# Timeouts (in seconds)
MaxTimeout = 150
NormalTimeout = 100
minTimeout = 50
ObjectRepositorySheetname = ohmdata
ActionLevelScreenshot = true
JsonScreenshot = true

implicit.wait=10
explicit.wait=20
page.load.timeout=30


# Credentials (example values - replace with real ones or load from env)
username=Admin
password=admin123
# Jira credentials
jira.url=https://your-jira-instance.atlassian.net
jira.username=your-jira-username
jira.api.token=your-jira-api-token
FeatureFileFolderName=src/test/resources/features
CucumberjsonReportFilepath=target/cucumber-reports

#specific ticktes from jira to be automated
jira.tickets=PROJ-123,PROJ-456
# Whether WebDriver should automatically manage driver binaries using WebDriverManager
use.webdrivermanager=true

# Optional: path to local driver binary if not using WebDriverManager
# driver.path=

# Logging / reporting
log.level=INFO
report.dir=target/cucumber-reports
FileDownloadPath = C:/Downloads
ExtendedReportActionLevelLog = target/extent-reports

# Optional: environment name (qa, staging, prod)
environment=qa

